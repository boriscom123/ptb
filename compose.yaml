name: ptb

x-php: &php
  build: ./docker/php
  image: ptb-php
  env_file: .env
  volumes:
    - ./backend:/var/www/backend
    - ./.env:/var/www/backend/.env:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./backend/public:/var/www/backend/public:ro
      - ./frontend:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - node
    networks:
      - default
      - agent
    restart: unless-stopped

  app:
    <<: *php

  queue:
    <<: *php
    # queue:listen перечитывает код на каждую задачу — правки применяются без перезапуска (dev)
    command: ["php", "artisan", "queue:listen", "--tries=3", "--sleep=1"]

  scheduler:
    <<: *php
    command: ["php", "artisan", "schedule:work"]

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/create-test-db.sh:/docker-entrypoint-initdb.d/create-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - default
      - agent
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  node:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    # Пересборка фронтенда при изменениях; результат в frontend/dist раздаёт Caddy
    command: ["sh", "-c", "npm install && npx vite build --watch"]
    restart: unless-stopped

  # AI-агент. Своя сеть (только caddy и postgres): нет доступа к redis, php-fpm и рабочей БД.
  agent:
    build: ./docker/agent
    image: ptb-agent
    environment:
      AGENT_SECRET: ${AGENT_SECRET}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
      EVENTS_URL: https://${APP_DOMAIN}/api/agent/events
      DB_HOST: postgres
      DB_TEST_DATABASE: ptb_agent_test
      DB_TEST_USERNAME: ptb_agent
      DB_TEST_PASSWORD: ${AGENT_DB_PASSWORD}
      GIT_AUTHOR_NAME: PTB Agent
      GIT_AUTHOR_EMAIL: agent@ptb.local
      GIT_COMMITTER_NAME: PTB Agent
      GIT_COMMITTER_EMAIL: agent@ptb.local
    volumes:
      - ./:/workspace
      # Секреты и логи приложения агенту не видны
      - /dev/null:/workspace/.env:ro
      - /dev/null:/workspace/backend/.env:ro
      - agent_home:/root
      - agent_worktrees:/worktrees
    tmpfs:
      - /workspace/backend/storage/logs
    networks:
      - agent
    restart: unless-stopped

networks:
  agent:

volumes:
  agent_home:
  agent_worktrees:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
