name: ptb

x-php: &php
  build: ./docker/php
  image: ptb-php
  env_file: .env
  volumes:
    - ./backend:/var/www/backend
    - ./.env:/var/www/backend/.env:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./backend/public:/var/www/backend/public:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - node
    restart: unless-stopped

  app:
    <<: *php

  queue:
    <<: *php
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=1"]

  scheduler:
    <<: *php
    command: ["php", "artisan", "schedule:work"]

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/create-test-db.sh:/docker-entrypoint-initdb.d/create-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  node:
    image: node:24-alpine
    working_dir: /app
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./frontend:/app
    command: ["sh", "-c", "npm install && npm run dev"]
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
